<div id="cricket-input" class="d-flex flex-row" [class.pad-locked]="disabled()" [attr.aria-disabled]="disabled()">
  <div class="cricket-input-container p-3 d-flex flex-column align-items-center">
    <div class="d-flex flex-column align-items-center pb-2">
      <span
        class="mark-badge"
        [class.closed]="bull().marks >= 3"
        [attr.aria-label]="i18n.t('game.marks', { field: 'Bull', count: bull().marks })"
      >{{ bull().marks }}</span>
      <app-bull-buttons
        class="mt-3 btn-scale"
        [disabled]="disabled() || bull().closedForAll"
        (bull)="throwBull(1, $event)"
        (bullseye)="throwBull(2, $event)"
      />
    </div>

    @for (row of rows(); track $index) {
      <div class="d-flex flex-row mt-3">
        @for (state of row; track state.field) {
          <div class="d-flex flex-column align-items-center mx-2">
            <span
              class="mark-badge"
              [class.closed]="state.marks >= 3"
              [attr.aria-label]="i18n.t('game.marks', { field: state.field, count: state.marks })"
            >{{ state.marks }}</span>
            <button
              [id]="'cricket-btn-' + state.field"
              type="button"
              class="mt-3 raised-button-3d input-btn-margin"
              [class.scoring]="state.scoring"
              matFab
              [color]="buttonColor()"
              [disabled]="disabled() || state.closedForAll"
              (shapeMorphClick)="throwField(state.field, $event)"
              appShapeMorph
            >
              {{ state.field }}
            </button>
          </div>
        }
      </div>
    }
  </div>

  <div class="d-flex multiplier-miss flex-column pt-5 me-2">
    <app-multiplier-toggle [(value)]="multiplier" [disabled]="disabled()" />
    <app-miss-button [disabled]="disabled()" (miss)="throwMiss($event)" />
  </div>
</div>
