<div id="dart-input" class="d-flex flex-row" [class.pad-locked]="disabled()" [attr.aria-disabled]="disabled()">
  <div class="input-container">
    <div class="d-flex flex-column mx-3 pt-2 btn-scale">
      <app-bull-buttons
        class="pb-3 mt-3"
        [disabled]="disabled()"
        (bull)="throwBull(1, $event)"
        (bullseye)="throwBull(2, $event)"
      />

      <div class="d-flex flex-row justify-content-center flex-wrap mt-4">
        @for (group of groups; track $index) {
          <div class="d-flex flex-column">
            @for (segment of group; track segment) {
              <div class="d-flex justify-content-center pb-3">
                <button
                  [id]="'dart-btn-' + segment"
                  type="button"
                  class="raised-button-3d input-btn-margin"
                  matFab
                  [color]="buttonColor()"
                  [disabled]="disabled()"
                  [attr.aria-label]="multiplierLabel() + ' ' + segment"
                  (shapeMorphClick)="throwSegment(segment, $event)"
                  appShapeMorph
                >
                  {{ segment }}
                </button>
              </div>
            }
          </div>
        }
      </div>
    </div>
  </div>

  <div class="d-flex multiplier-miss flex-column pt-5 me-2">
    <app-multiplier-toggle [(value)]="multiplier" [disabled]="disabled()" />
    <app-miss-button [disabled]="disabled()" (miss)="throwMiss($event)" />
  </div>
</div>
